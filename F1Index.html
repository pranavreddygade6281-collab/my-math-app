<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Private VidyaMath</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    
    <script>
        // REPLACE THE TEXT BELOW WITH YOUR KEY FROM GOOGLE
        const API_KEY = "AIzaSyDi1CsHkrt8JDEYPjR03T654M45gLjd-Ag"; 
        const MY_PIN = "1234"; // Your private entry code

        const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;
        let currentGrade = "B.Tech";
        let base64Image = null;
        let imageMimeType = null;

        window.onload = function() {
            let pass = prompt("Enter PIN:");
            if (pass !== MY_PIN) {
                document.body.innerHTML = "<h1>Unauthorized Access</h1>";
            }
            loadHistory();
        };

        function setGrade(val, btn) {
            currentGrade = val;
            document.querySelectorAll('.grade-btn').forEach(b => {
                b.classList.remove('bg-indigo-600', 'text-white');
                b.classList.add('text-slate-500');
            });
            btn.classList.add('bg-indigo-600', 'text-white');
            btn.classList.remove('text-slate-500');
        }

        function previewFile() {
            const file = document.getElementById('fileInput').files[0];
            const reader = new FileReader();
            reader.onloadend = function() {
                base64Image = reader.result;
                imageMimeType = file.type;
                document.getElementById('imagePreview').src = reader.result;
                document.getElementById('imagePreviewContainer').classList.remove('hidden');
            }
            if (file) reader.readAsDataURL(file);
        }

        async function solve() {
            const text = document.getElementById('problemArea').value;
            const btn = document.getElementById('solveBtn');
            if(!text && !base64Image) return alert("Please provide a problem.");

            btn.innerHTML = "THINKING...";
            btn.disabled = true;

            try {
                let parts = [{ text: `Solve this ${currentGrade} math problem step-by-step: ${text}` }];
                if(base64Image) parts.push({ inlineData: { mimeType: imageMimeType, data: base64Image.split(',')[1] } });

                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts }],
                        systemInstruction: { parts: [{ text: "Expert Math Professor. Use LaTeX for math." }] }
                    })
                });

                const data = await res.json();
                const answer = data.candidates[0].content.parts[0].text;
                
                document.getElementById('resultBody').innerHTML = marked.parse(answer);
                MathJax.typesetPromise();
                document.getElementById('resultCard').classList.remove('hidden');

                // Save to Memory
                let history = JSON.parse(localStorage.getItem('math_history')) || [];
                history.unshift({ q: text || "Image Problem", a: answer, time: new Date().toLocaleString() });
                localStorage.setItem('math_history', JSON.stringify(history));
                loadHistory();

            } catch (e) {
                alert("Error! Check your API Key.");
            } finally {
                btn.innerHTML = "SOLVE PROBLEM";
                btn.disabled = false;
            }
        }

        function loadHistory() {
            const list = document.getElementById('historyList');
            let history = JSON.parse(localStorage.getItem('math_history')) || [];
            list.innerHTML = history.map((i, idx) => `
                <div class="p-3 bg-white mb-2 rounded-lg border">
                    <p class="text-xs text-slate-400">${i.time}</p>
                    <p class="font-bold truncate">${i.q}</p>
                    <button onclick="this.nextElementSibling.classList.toggle('hidden')" class="text-indigo-600 text-xs">View Answer</button>
                    <div class="hidden mt-2 text-sm border-t pt-2">${marked.parse(i.a)}</div>
                </div>
            `).join('');
            MathJax.typesetPromise();
        }
    </script>
</head>
<body class="bg-slate-100 min-h-screen p-4">
    <div class="max-w-md mx-auto space-y-4">
        <div class="flex justify-between items-center bg-indigo-600 p-4 rounded-2xl text-white shadow-lg">
            <h1 class="font-bold">VIDYAMATH PRO</h1>
            <button onclick="document.getElementById('hist').classList.toggle('hidden')" class="text-sm bg-indigo-500 px-3 py-1 rounded-lg">History</button>
        </div>

        <div class="bg-white p-2 rounded-xl flex gap-1 shadow-sm">
            <button onclick="setGrade('10th', this)" class="grade-btn flex-1 py-2 rounded-lg text-slate-500 font-bold text-xs">10TH</button>
            <button onclick="setGrade('Intermediate', this)" class="grade-btn flex-1 py-2 rounded-lg text-slate-500 font-bold text-xs">INTER</button>
            <button onclick="setGrade('B.Tech', this)" class="grade-btn flex-1 py-2 rounded-lg bg-indigo-600 text-white font-bold text-xs">B.TECH</button>
        </div>

        <div class="bg-white p-4 rounded-3xl shadow-md space-y-4">
            <textarea id="problemArea" class="w-full h-32 p-3 bg-slate-50 rounded-xl outline-none" placeholder="Paste problem here..."></textarea>
            <div id="imagePreviewContainer" class="hidden"><img id="imagePreview" class="h-16 w-16 rounded-lg object-cover"></div>
            <div class="flex gap-2">
                <button onclick="document.getElementById('fileInput').click()" class="bg-slate-100 p-4 rounded-xl"><i class="fas fa-camera"></i></button>
                <input type="file" id="fileInput" class="hidden" accept="image/*" onchange="previewFile()">
                <button id="solveBtn" onclick="solve()" class="flex-1 bg-indigo-600 text-white font-bold rounded-xl">SOLVE PROBLEM</button>
            </div>
        </div>

        <div id="resultCard" class="hidden bg-white p-5 rounded-3xl shadow-xl border-t-4 border-indigo-600">
            <div id="resultBody" class="prose text-slate-800"></div>
        </div>

        <div id="hist" class="hidden bg-slate-200 p-4 rounded-3xl">
            <h2 class="font-bold mb-3">Saved Problems</h2>
            <div id="historyList"></div>
            <button onclick="localStorage.clear(); location.reload();" class="w-full mt-4 text-red-500 text-xs font-bold">WIPE ALL MEMORY</button>
        </div>
    </div>
</body>
</html>
